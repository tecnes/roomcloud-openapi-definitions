openapi: "3.1.0"
info:
  version: "1.1.4"
  title: "Roomcloud Authentication API OpenApi definition"
  x-last-updated: "2026-02-24"
servers:
  - url: "https://authenticator.g.roomcloud.net"
    description: "Production"
  - url: "https://apitest.roomcloud.net"
    description: "Development server"

paths:
  /oauth/token:
    post:
      summary: OAuth 2.0 Client Credentials Grant (RFC 6749 §4.4)
      tags:
      - JWT
      description: >
        Issues a signed JWT access token for a registered client.
        Credentials can be supplied either as form body parameters (`client_id` / `client_secret`)
        or via an `Authorization: Basic base64(client_id:client_secret)` header.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/oauth_token_request'
      responses:
        '200':
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_token_response'
              examples:
                success:
                  value:
                    access_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
                    token_type: Bearer
                    expires_in: 900
                    scope: read write
        '400':
          description: Invalid request or unsupported grant type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_error_response'
              examples:
                unsupported_grant_type:
                  value:
                    error: unsupported_grant_type
                    error_description: Only client_credentials grant type is supported
                invalid_request:
                  value:
                    error: invalid_request
                    error_description: Content-Type must be application/x-www-form-urlencoded
        '401':
          description: Client authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_error_response'
              examples:
                invalid_client:
                  value:
                    error: invalid_client
                    error_description: Client authentication failed
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/oauth_error_response'
              examples:
                server_error:
                  value:
                    error: server_error
                    error_description: An unexpected error occurred

  /authenticator/api/oauth/authenticate:
    post:
      summary: when sucesfully authenticated, the response contains a JWT token to be used as a Bearer token in the Authorization header for all API requests.
      requestBody:
        content: 
          application/json:
            schema:
              type: object
              required:
                - CLIENT_ID
                - CLIENT_SECRET
              properties:
                CLIENT_ID:
                  type: string 
                CLIENT_SECRET:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./schemas/authentication.yaml#/AuthenticationSuccess"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "./schemas/commons.yaml#/ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "./schemas/commons.yaml#/ResponseError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "./schemas/commons.yaml#/ResponseError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "./schemas/commons.yaml#/ResponseError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "./schemas/commons.yaml#/ResponseError"
      tags:
        - authentication
  /authenticator/api/clients/secret:
    put:
      summary: change secret request.
      requestBody:
        content: 
          application/json:
            schema:
              type: object
              required:
                - CLIENT_SECRET_CURRENT
                - CLIENT_SECRET_NEW
              properties:
                CLIENT_SECRET_CURRENT:
                  type: string
                CLIENT_SECRET_NEW:
                  type: string
                  minLength: 12 
                  pattern: "^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*+_()\\-]).{12,}$"
                  description: |
                    The new client_secret must satisfy the following rules:
                      • Minimum 12 characters  
                      • At least one digit  
                      • At least one lowercase letter  
                      • At least one uppercase letter  
                      • At least one special character: ! @ # $ % ^ & * + _ ( ) -  
                      • Must be different from the last 3 used  
                  example: "Abcdef12#XYZ"

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "./schemas/commons.yaml#/OpenApiResponseSuccessBase"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "./schemas/commons.yaml#/ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "./schemas/commons.yaml#/ResponseError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "./schemas/commons.yaml#/ResponseError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "./schemas/commons.yaml#/ResponseError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "./schemas/commons.yaml#/ResponseError"
      tags:
        - secrets
      security:
        - JWTAuth: []
components:
  securitySchemes:
    JWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    oauth_token_request:
      type: object
      properties:
        grant_type:
          type: string
          enum:
          - client_credentials
        client_id:
          type: string
        client_secret:
          type: string
      required:
      - grant_type
    oauth_token_response:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Seconds until the token expires
          example: 900
        scope:
          type: string
          description: Space-separated list of granted scopes
    oauth_error_response:
      type: object
      properties:
        error:
          type: string
        error_description:
          type: string
# Commons (Error, ErrorRS, Timestamp, Paging, Base Response Envelopes)
    Error:
      $ref: "./schemas/commons.yaml#/Error"

    Timestamp:
      $ref: "./schemas/commons.yaml#/Timestamp"

    OpenApiResponseSuccessBase:
      $ref: "./schemas/commons.yaml#/OpenApiResponseSuccessBase"

    ResponseError:
      $ref: "./schemas/commons.yaml#/ResponseError"
    
    